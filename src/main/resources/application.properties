spring.application.name=feiraviva

# Porta do servidor
server.port=8090

# Banco H2 (desenvolvimento) — DB_CLOSE_DELAY mantém o banco vivo entre conexões
spring.datasource.url=jdbc:h2:mem:feiraviva;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Console do H2 (habilitado pelo spring-boot-h2console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate — Flyway assume o controle do esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway (habilitado pelo spring-boot-starter-flyway)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Mostra só os @ApiResponse declarados em cada endpoint (sem os genéricos do ApiErrorHandler)
springdoc.override-with-generic-response=false
